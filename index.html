<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neno Banana Dark Studio X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Playfair Display', serif;
        background-color: #000;
      }
      .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            keyframes: {
              glow: {
                '0%, 100%': { filter: 'drop-shadow(0 0 8px rgba(250, 204, 21, 0.8))' },
                '50%': { filter: 'drop-shadow(0 0 20px rgba(250, 204, 21, 1))' },
              },
              shimmer: {
                '0%': { background-position: '-200% center' },
                '100%': { background-position: '200% center' },
              },
              'hologram-pulse': {
                '0%, 100%': { textShadow: '0 0 4px rgba(250, 204, 21, 0.4), 0 0 6px rgba(192, 132, 252, 0.4)', transform: 'skewX(-10deg) scale(1)' },
                '50%': { textShadow: '0 0 12px rgba(250, 204, 21, 0.8), 0 0 16px rgba(192, 132, 252, 0.8)', transform: 'skewX(-10deg) scale(1.02)' },
              },
              'energy-wave': {
                '0%': { transform: 'scale(0)', opacity: '0.75' },
                '100%': { transform: 'scale(2.5)', opacity: '0' },
              },
              reveal: {
                '0%': { opacity: '0', transform: 'scale(1.1)', filter: 'brightness(2) blur(5px)' },
                '100%': { opacity: '1', transform: 'scale(1)', filter: 'brightness(1) blur(0px)' },
              },
              scanner: {
                '0%': { top: '0%', opacity: '0.5' },
                '100%': { top: '100%', opacity: '0' },
              },
              'logo-float': {
                '0%, 100%': { transform: 'translateY(0) rotate(-2deg)' },
                '50%': { transform: 'translateY(-5px) rotate(2deg)' },
              },
              'sparkle': {
                  '0%, 100%': { transform: 'scale(0.5)', opacity: '0' },
                  '50%': { transform: 'scale(1.5)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'slide-in-right': {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              'slide-out-right': {
                '0%': { transform: 'translateX(0)', opacity: '1' },
                '100%': { transform: 'translateX(100%)', opacity: '0' },
              }
            },
            animation: {
              glow: 'glow 3s ease-in-out infinite',
              shimmer: 'shimmer 4s linear infinite',
              'hologram-pulse': 'hologram-pulse 3s ease-in-out infinite',
              'energy-wave': 'energy-wave 1.5s ease-out infinite',
              reveal: 'reveal 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              scanner: 'scanner 2.5s ease-out forwards',
              'logo-float': 'logo-float 5s ease-in-out infinite',
              'sparkle': 'sparkle 0.8s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-in-right': 'slide-in-right 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              'slide-out-right': 'slide-out-right 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
